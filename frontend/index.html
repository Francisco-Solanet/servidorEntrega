<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Vehículos</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>Gestor de Vehículos</h1>
        <p>Consultá, agregá y eliminá vehículos del catálogo.</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Agregar vehículo</h2>

            <form id="form-vehiculo">
                <label for="marca">Marca</label>
                <input type="text" id="marca" name="marca" required>

                <label for="modelo">Modelo</label>
                <input type="text" id="modelo" name="modelo" required>

                <label for="anio">Año</label>
                <input type="number" id="anio" name="anio" required>

                <label for="precio_venta">Precio de venta</label>
                <input type="number" id="precio_venta" name="precio_venta"
                       min="0" step="0.01" required>

                <label for="kilometraje">Kilometraje</label>
                <input type="number" id="kilometraje" name="kilometraje"
                       min="0" required>

		<button type="submit" id="btn-guardar">Agregar vehículo</button>
		<button type="button" id="btn-cancelar" hidden>Cancelar modificación</button>               

            </form>

            <p id="mensaje" role="status"></p>
        </section>

        <section class="listado">
            <h2>Vehículos registrados</h2>
            <div id="lista-vehiculos">
                <p>Cargando vehículos...</p>
            </div>
        </section>
    </main>
</body>
</html>
